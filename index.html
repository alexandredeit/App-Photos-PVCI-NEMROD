<style>
/* Layout: one-column field checklist, sticky site bar on top, sticky export bar at bottom */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --fg:#16212C; --muted:#5B6875; --line:#D3DAE1;
  --accent:#0E56C9; --accent-fg:#FFFFFF; --ok:#1E7F47; --nok:#C0352B; --so:#7A8592; --chip:#E3E8EE;
  --f-display:"Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#18212A; --fg:#E7ECF1; --muted:#97A3AF; --line:#2B3845;
  --accent:#5B9BFF; --accent-fg:#0B1320; --ok:#4CC27F; --nok:#FF7A6E; --so:#8C98A4; --chip:#24303B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --fg:#E7ECF1; --muted:#97A3AF; --line:#2B3845;
  --accent:#5B9BFF; --accent-fg:#0B1320; --ok:#4CC27F; --nok:#FF7A6E; --so:#8C98A4; --chip:#24303B; color-scheme:dark}
*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
button{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.igrow{display:flex;gap:8px;align-items:center}
.igrow label{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
#ig{flex:1;min-width:0;font-family:var(--f-mono);font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#ig:focus{outline:none;border-color:var(--accent)}
#ig.empty{border-color:var(--nok)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tog{font:600 13px var(--f-body);padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main .wrap{padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
.sec h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:0}
.sec .sc{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sec[open]>summary{border-bottom:1px solid var(--line)}
.item{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.item:last-child{border-bottom:0}
.item.done{box-shadow:inset 4px 0 0 var(--ok)}
.item.isso{box-shadow:inset 4px 0 0 var(--so);opacity:.7}
.item.isnok{box-shadow:inset 4px 0 0 var(--nok)}
.ihead{display:flex;gap:10px;align-items:flex-start}
.ilabel{flex:1;min-width:0}
.ilabel b{font-weight:600;display:block}
.fname{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-all}
.shoot{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 14px;font:700 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.shoot svg{width:18px;height:18px}
.shoot:focus-visible,.tog:focus-visible,.st button:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.st button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:6px 11px;cursor:pointer}
.st button+button{border-left:1px solid var(--line)}
.st button.on[data-v="SO"]{background:var(--so);color:var(--surface)}
.st button.on[data-v="OK"]{background:var(--ok);color:var(--surface)}
.st button.on[data-v="NOK"]{background:var(--nok);color:var(--surface)}
.gal{link:0}
.gallery{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:76px}
.ph img{width:76px;height:76px;object-fit:cover;border-radius:6px;display:block;background:var(--chip)}
.ph .del{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);background:var(--fg);color:var(--bg);font-size:13px;line-height:18px;cursor:pointer;padding:0}
.ph .sv{width:100%;margin-top:3px;padding:3px 0;font-size:11px}
.ph .sv.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tog.miss{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tog.miss.urgent{background:var(--nok);border-color:var(--nok);color:var(--surface)}
.ph span{display:block;font:500 10px var(--f-mono);color:var(--muted);text-align:center;margin-top:2px}
.cmt{width:100%;font:14px var(--f-body);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.addlib{display:flex;gap:8px;padding:12px 14px;flex-wrap:wrap}
.addlib input{flex:1;min-width:160px;font:14px var(--f-mono);padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
footer.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
footer.dock .wrap{padding-block:10px;display:flex;gap:8px;align-items:center}
.btn{font:700 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-radius:8px;border:0;cursor:pointer}
.btn.main{flex:1;background:var(--fg);color:var(--bg)}
.btn.send{background:var(--accent);color:var(--accent-fg)}
.ver{font:500 12px var(--f-mono);color:var(--muted);letter-spacing:0;text-transform:none;vertical-align:middle}
.btn.ghost{background:var(--chip);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
#msg{font-size:13px;color:var(--muted);min-height:1em}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.rules{font-size:13px;color:var(--muted);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.rules code{font-family:var(--f-mono);color:var(--fg)}
.busy{opacity:.6;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.tog.galbtn{background:var(--ok);border-color:var(--ok);color:var(--surface)}
#install{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.homebtn{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.homebtn svg{width:18px;height:18px}
.homebtn img{width:34px;height:34px;border-radius:8px;display:block}
.homebtn:has(img){border:0;background:none}
.brand .left{display:flex;align-items:center;gap:10px;min-width:0}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.nav button{font:700 15px var(--f-display);letter-spacing:.05em;text-transform:uppercase;padding:9px 6px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.nav button+button{border-left:1px solid var(--line)}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
.nav button .n{font:500 11px var(--f-mono);letter-spacing:0;text-transform:none;opacity:.85;margin-left:4px}
.tiles{display:grid;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;color:var(--fg);font:inherit}
.tile h2{font:700 24px var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:10px}
.tile h2 svg{width:24px;height:24px;color:var(--accent)}
.tile p{margin:0;color:var(--muted);font-size:14px}
.tile .tstat{font:500 13px var(--f-mono);color:var(--fg)}
.tile .bar{margin-top:4px}
.tile .go{align-self:flex-start;margin-top:4px;background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:8px 14px;font:700 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.hint{font-size:13px;color:var(--muted);padding:2px 2px 0}
.xsub{font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:12px 14px 2px}
.xitem{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.xitem:last-child{border-bottom:0}
.xitem.ok{box-shadow:inset 4px 0 0 var(--ok)}
.xitem.so{box-shadow:inset 4px 0 0 var(--so)}
.xitem.nok{box-shadow:inset 4px 0 0 var(--nok)}
.xitem.filled{box-shadow:inset 4px 0 0 var(--accent)}
.xlab b{font-weight:600;display:block}
.xfmt{font:12px var(--f-mono);color:var(--muted)}
.xin{width:100%;font:15px var(--f-body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
textarea.xin{min-height:64px;resize:vertical;line-height:1.35}
.xin:focus{outline:none;border-color:var(--accent)}
.xrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.xrow .xin{flex:1;min-width:0}
.xrow .u{font:13px var(--f-mono);color:var(--muted)}
.xrow .mini{flex:0 1 92px;min-width:70px}
.xrow .x{color:var(--muted)}
.chips{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.chips button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:7px 11px;cursor:pointer}
.chips button+button{border-left:1px solid var(--line)}
.chips button.on{background:var(--fg);color:var(--bg)}
.stx button.on[data-v="Conforme"]{background:var(--ok);color:var(--surface)}
.stx button.on[data-v="Non conforme"]{background:var(--nok);color:var(--surface)}
.stx button.on[data-v="Sans objet"]{background:var(--so);color:var(--surface)}
.xnote{font-size:12px;color:var(--muted);white-space:pre-line}
details.spec summary{font:600 12px var(--f-body);color:var(--accent);cursor:pointer}
details.spec div{font-size:12px;color:var(--muted);white-space:pre-line;padding-top:4px}
.linkbtn{background:none;border:0;color:var(--accent);font:600 13px var(--f-body);padding:0;cursor:pointer;align-self:flex-start}
.tog.xexp{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.imp{background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.imp b{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.imp p{margin:0;font-size:14px;color:var(--muted)}
.imp .row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>

<script>
// Mini ZIP (sans compression, format standard) : remplace JSZip pour fonctionner hors ligne
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function dosTime(d){return ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF}
function dosDate(d){return (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF}
class JSZip{
  constructor(){this.entries=[]}
  file(name,data,opts){this.entries.push({name,data,date:(opts&&opts.date)||new Date()});return this}
  async generateAsync(){
    const enc=new TextEncoder();const parts=[];const central=[];let offset=0;
    for(const e of this.entries){
      const nameB=enc.encode(e.name);
      const u8=typeof e.data==="string"?enc.encode(e.data):(e.data instanceof Uint8Array?e.data:new Uint8Array(await e.data.arrayBuffer()));
      const crc=crc32(u8),t=dosTime(e.date),d=dosDate(e.date);
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
      lh.setUint16(10,t,true);lh.setUint16(12,d,true);lh.setUint32(14,crc,true);lh.setUint32(18,u8.length,true);lh.setUint32(22,u8.length,true);
      lh.setUint16(26,nameB.length,true);lh.setUint16(28,0,true);
      parts.push(lh.buffer,nameB,u8);
      const ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
      ch.setUint16(12,t,true);ch.setUint16(14,d,true);ch.setUint32(16,crc,true);ch.setUint32(20,u8.length,true);ch.setUint32(24,u8.length,true);
      ch.setUint16(28,nameB.length,true);ch.setUint32(42,offset,true);
      central.push(ch.buffer,nameB);
      offset+=30+nameB.length+u8.length;
    }
    const cdSize=central.reduce((a,b)=>a+(b.byteLength),0);
    const end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);end.setUint16(8,this.entries.length,true);end.setUint16(10,this.entries.length,true);
    end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
    return new Blob([...parts,...central,end.buffer],{type:"application/zip"});
  }
}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

const ITEMS={};SECTIONS.forEach(([s,arr])=>arr.forEach(a=>ITEMS[a[0]]={c:a[0],l:a[1]||a[0],g:!!a[2],sec:s}));

const MAX_BYTES=2.8*1024*1024, MAX_SIDE=2560;
const $=s=>document.querySelector(s);
let state={ig:"",st:{},cm:{},extra:[],saveEach:false,v3:1,xl:{},view:"home"};
let view="home";
let photos=[]; // {id,item,blob,ts}
const urls=new Map();
let filterTodo=false;

function lsGet(){try{const s=JSON.parse(localStorage.getItem("pvci_pwa_state")||"null");if(s)state=Object.assign(state,s)}catch(e){}}
function lsSet(){try{localStorage.setItem("pvci_pwa_state",JSON.stringify(state))}catch(e){}}

// IndexedDB pour garder les photos si l'onglet se ferme
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res)=>{try{const r=indexedDB.open("pvci_pwa_photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
async function idb(mode,fn){const d=await db();if(!d)return null;return new Promise(res=>{try{const t=d.transaction("p",mode);const r=fn(t.objectStore("p"));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>res(null)}catch(e){res(null)}})}

function cleanIG(v){return v.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9-]/g,"").toUpperCase()}
function cleanCode(v){return v.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_-]+/g,"_").replace(/^_+|_+$/g,"")}
function itemPhotos(c){return photos.filter(p=>p.item===c).sort((a,b)=>a.ts-b.ts)}
function fileName(c,idx,total){const it=ITEMS[c];const ig=state.ig||"IG";return `${ig}_${c}${idx>0?"_"+(idx+1):""}${it&&it.g?"_GEN":""}.jpg`}
function nextName(c){const n=itemPhotos(c).length;return fileName(c,n,n+1)}

function allCodes(){return [...Object.keys(ITEMS),...state.extra]}
function render(){
  const list=$("#list");const openSet=new Set([...list.querySelectorAll("details[open]")].map(d=>d.dataset.s));
  const first=!list.children.length;
  list.innerHTML="";
  const groups=[...SECTIONS.map(([s,a])=>[s,a.map(x=>x[0])]),["Photos libres",state.extra]];
  groups.forEach(([s,codes],gi)=>{
    const d=document.createElement("details");d.className="sec";d.dataset.s=s;
    if(openSet.has(s)||(first&&gi===0))d.open=true;
    const done=codes.filter(isDone).length;
    d.innerHTML=`<summary><h2>${s}</h2><span class="sc">${done}/${codes.length}</span></summary>`;
    codes.forEach(c=>{if(filterTodo&&isDone(c))return;d.appendChild(renderItem(c))});
    if(s==="Photos libres"){const a=document.createElement("div");a.className="addlib";
      a.innerHTML=`<input id="libName" placeholder="Nom de la photo (ex. Fissure_Terrasse)"><button class="tog" id="libAdd">Ajouter la ligne</button>`;
      d.appendChild(a);
      a.querySelector("#libAdd").onclick=()=>{const v=cleanCode(a.querySelector("#libName").value);if(!v)return;if(!ITEMS[v]&&!state.extra.includes(v)){state.extra.push(v);lsSet()}d.open=true;render()};
    }
    list.appendChild(d);
  });
  const rules=document.createElement("div");rules.className="sec rules";
  rules.innerHTML=`<div>Nommage : <code>CodeIG_Désignation.jpg</code>, vue d'ensemble : <code>CodeIG_Acces_VueGenerale_GEN.jpg</code>.</div><div>Plusieurs photos sur une ligne : la 1re garde le nom de base, les suivantes prennent <code>_2</code>, <code>_3</code>… pour éviter les doublons (sinon seule la plus récente est gardée).</div><div>JPEG, réduit automatiquement sous 3 Mo (photo d'origine conservée si déjà conforme).</div><div>Sauvegarde en cours de visite : « Vers la galerie » envoie toutes les nouvelles photos d'un coup (iPhone : « Enregistrer les images »), « Sauvegarder (1 ZIP) » les range dans Fichiers.</div><div>Version 2.4 · le ZIP final (CodeIG_auditPVCI_date.zip) contient le PVCI Excel rempli, le récap CSV et un dossier Photos.</div><div>Installer l'appli : iPhone, Safari → Partager → « Sur l'écran d'accueil ». Android, Chrome → menu ⋮ → « Installer l'application ». Elle marche ensuite sans réseau.</div>`;
  list.appendChild(rules);
  stats();
}
function isDone(c){return itemPhotos(c).length>0||state.st[c]==="SO"}
function renderItem(c){
  const it=ITEMS[c]||{c,l:c,g:false};const ps=itemPhotos(c);const st=state.st[c]||"";
  const el=document.createElement("div");
  el.className="item"+(st==="SO"?" isso":st==="NOK"?" isnok":ps.length?" done":"");
  const label=it.l!==c?`<b>${esc(it.l)}</b>`:`<b>${esc(c)}</b>`;
  el.innerHTML=`<div class="ihead"><div class="ilabel">${label}<div class="fname">${esc(nextName(c))}</div></div>
  <button class="shoot" data-a="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo</button></div>
  <div class="row2"><div class="st">${["SO","OK","NOK"].map(v=>`<button data-v="${v}" class="${st===v?"on":""}">${v}</button>`).join("")}</div>
  <button class="tog" data-a="gal">Depuis la galerie</button></div>
  ${ps.length?`<div class="gallery">${ps.map((p,i)=>`<div class="ph"><img alt="" src="${url(p)}"><button class="del" data-id="${p.id}" aria-label="Supprimer">✕</button><span>${i>0?"_"+(i+1):"n°1"} · ${(p.blob.size/1048576).toFixed(1)} Mo</span><button class="tog sv${p.saved?" ok":""}" data-id="${p.id}">${p.saved?"✓ Sur le tél.":"Enregistrer"}</button></div>`).join("")}</div>`:""}
  ${st==="NOK"||state.cm[c]?`<input class="cmt" placeholder="Commentaire" value="${esc(state.cm[c]||"")}">`:""}`;
  el.querySelector('[data-a="cam"]').onclick=()=>pick("#cam",c);
  el.querySelector('[data-a="gal"]').onclick=()=>pick("#gal",c);
  el.querySelectorAll(".st button").forEach(b=>b.onclick=()=>{state.st[c]=state.st[c]===b.dataset.v?"":b.dataset.v;lsSet();render()});
  el.querySelectorAll(".del").forEach(b=>b.onclick=()=>delPhoto(b.dataset.id));
  el.querySelectorAll(".sv").forEach(b=>b.onclick=()=>{const p=photos.find(x=>x.id===b.dataset.id);if(p)saveOne(p)});
  const cm=el.querySelector(".cmt");if(cm)cm.oninput=()=>{state.cm[c]=cm.value;lsSet()};
  return el;
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function url(p){if(!urls.has(p.id))urls.set(p.id,URL.createObjectURL(p.blob));return urls.get(p.id)}
function stats(){
  const codes=allCodes();const done=codes.filter(isDone).length;
  if(view==="photos")$("#prog").style.width=(codes.length?done/codes.length*100:0)+"%";
  const nSaved=photos.filter(p=>p.saved).length, miss=photos.length-nSaved;
  if(view==="photos")$("#count").textContent=`${photos.length} photo${photos.length>1?"s":""} · ${done}/${codes.length} lignes · ${nSaved} sur le tél.`;
  $("#navP").textContent=`${done}/${codes.length}`;
  if(view!=="photos")xStats();
  if(typeof prepared!=="undefined"&&prepared&&prepared.count!==photos.length){prepared=null;const sb=document.getElementById("send");if(sb)sb.textContent="Envoyer"}
  const gb=$("#fGallery");gb.hidden=!miss||savingAll||view!=="photos";gb.textContent=`Vers la galerie (${miss})`;
  const mb=$("#fMissing");mb.hidden=!miss||savingAll||view!=="photos";mb.textContent=`Sauvegarder ${miss} nouvelle${miss>1?"s":""} photo${miss>1?"s":""} (1 ZIP)`;mb.classList.toggle("urgent",miss>=15);
  const fs=$("#fSave");fs.hidden=view!=="photos";fs.setAttribute("aria-pressed",state.saveEach===true);fs.textContent="Copie photo par photo : "+(state.saveEach===true?"activée":"désactivée");
  $("#ig").classList.toggle("empty",!state.ig);
}

let target=null;
function pick(sel,c){target=c;const i=$(sel);i.value="";i.click()}
async function onFiles(e){
  const files=[...e.target.files];if(!files.length||!target)return;const c=target;
  msg(`Traitement de ${files.length} photo${files.length>1?"s":""}…`);
  for(const f of files){
    try{const blob=await toJpeg(f);const p={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),item:c,blob,ts:Date.now()};
      photos.push(p);await idb("readwrite",s=>s.put(p));
      if(state.saveEach===true){render();await saveOne(p)}}
    catch(err){msg("Impossible de lire "+f.name+". Essaie depuis la galerie.");continue}
  }
  if(state.st[c]===""||!state.st[c]){state.st[c]="OK";lsSet()}
  if(state.saveEach!==true){const miss=photos.filter(p=>!p.saved).length;msg(`Ajoutée : ${fileName(c,itemPhotos(c).length-1,itemPhotos(c).length)}`+(miss>=15?` · ${miss} photos non sauvegardées, pense à faire une sauvegarde.`:""))}
  render();
}
$("#cam").onchange=onFiles;$("#gal").onchange=onFiles;

async function toJpeg(f){
  if((f.type==="image/jpeg"||/\.jpe?g$/i.test(f.name))&&f.size<=MAX_BYTES)return f.slice(0,f.size,"image/jpeg");
  let bmp;
  try{bmp=await createImageBitmap(f,{imageOrientation:"from-image"})}
  catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f)})}
  const w=bmp.width,h=bmp.height;let scale=Math.min(1,MAX_SIDE/Math.max(w,h));
  for(let attempt=0;attempt<6;attempt++){
    const cv=document.createElement("canvas");cv.width=Math.round(w*scale);cv.height=Math.round(h*scale);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    for(const q of [0.88,0.8,0.72]){
      const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));
      if(b&&b.size<=MAX_BYTES)return b;
    }
    scale*=0.8;
  }
  throw new Error("trop lourde");
}
async function delPhoto(id){
  photos=photos.filter(p=>p.id!==id);if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}
  await idb("readwrite",s=>s.delete(id));render();
}
function msg(t){$("#msg").textContent=t}
function nameOf(p){const ps=itemPhotos(p.item);const i=ps.indexOf(p);return fileName(p.item,i,ps.length)}
let savingAll=false;
async function saveOne(p){
  if(!state.ig){msg("Renseigne le code IG : la photo est gardée dans l'audit, tu pourras l'enregistrer ensuite avec « Enregistrer les manquantes ».");return "noig"}
  const dl=DL;
  if(!dl){msg("Enregistrement indisponible dans cette vue.");return "off"}
  const name=nameOf(p);
  try{await dl.save({filename:name,data:p.blob});p.saved=true;await idb("readwrite",s=>s.put(p));msg("Enregistrée sur le téléphone : "+name);render();return "ok"}
  catch(e){const c=e&&e.code;msg(c==="declined"?"Non enregistrée sur le téléphone : "+name+" (elle reste dans l'audit).":c==="rate_limited"?"Une demande d'enregistrement est déjà ouverte. Réessaie avec « Enregistrer les manquantes ».":"Enregistrement impossible ("+(c||"erreur")+").");return c||"err"}
}
async function saveMissing(){
  if(savingAll)return;
  if(!state.ig){msg("Renseigne le code IG avant de sauvegarder, pour que les photos aient le bon nom.");$("#ig").focus();return}
  
  const dl=DL;
  if(!dl){msg("Sauvegarde indisponible dans cette vue.");return}
  const todo=photos.filter(p=>!p.saved);if(!todo.length)return;
  savingAll=true;render();msg("Préparation de la sauvegarde…");
  try{
    const zip=new JSZip();todo.forEach(p=>zip.file(nameOf(p),p.blob,{date:new Date(p.ts)}));
    const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
    const d=new Date(),hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");
    await dl.save({filename:`${state.ig}_sauvegarde_${hh}h${mm}.zip`,data:blob});
    for(const p of todo){p.saved=true;await idb("readwrite",s=>s.put(p))}
    msg(`${todo.length} photo${todo.length>1?"s":""} sauvegardée${todo.length>1?"s":""} sur le téléphone (${state.ig}_sauvegarde_${hh}h${mm}.zip).`);
  }catch(e){const c=e&&e.code;msg(c==="declined"?"Sauvegarde annulée : les photos restent dans l'audit.":c==="rate_limited"?"Une demande est déjà ouverte, réessaie dans un instant.":"Sauvegarde impossible ("+(c||"erreur")+").")}

let prepared=null;

async function buildExportZip(){
  const zip=new JSZip();const rows=[["Section","Désignation","Statut","Nb photos","Fichiers","Commentaire"]];
  const groups=[...SECTIONS.map(([s,a])=>[s,a.map(x=>x[0])]),["Photos libres",state.extra]];

  }
};

a terrasse.\nEn cas de sécurité individuelle, présence d’un rail (de type Söll) avec repose-pieds rabattables aux positions de travail et de points d’ancrage", "nf": 0}, {"id": "Infrastructures!32", "row": 32, "rub": "Infrastructures SPH", "sub": "Sécurité pylône / mâts", "label": "Point d’ancrage", "fmt": "Oui / Non / Sans objet", "yn": 1, "spec": "Si présence de points d'ancrage sur maçonnerie, vérification de l'étiquetage de conformité", "nf": 0}, {"id": "Infrastructures!33", "row": 33, "rub": "Infrastructures SPH", "sub": "Sécurité pylône / mâts", "label": "Paliers de repos", "fmt": "Oui / Non / Sans objet", "yn": 1, "nf": 0}, {"id": "Infrastructures!34", "row": 34, "rub": "Infrastructures SPH", "sub": "Sécurité pylône / mâts", "label": "Plateformes avec garde-corps", "fmt": "Oui / Non / Sans objet", "yn": 1, "nf": 0}, {"id": "Infrastructures!35", "row": 35, "rub": "Infrastructures SPH", "sub": "Sécurité / CEM", "label": "Garde-corps périphérique total ou partiel, délimitation zone CEM et affichage", "fmt": "Description", "spec": "Les mâts sont disposés de manière sécurisée en fonction de la configuration de la terrasse et des besoins radio.\n Ils sont accueillis au pied de chaque mât d’antenne et sont systématiquement accessibles en sécurité collective et hors zone OEM. \nLes chemins de câbles sont installés dans le périmètre en sécurité collective et de manière à éviter les appuis précaires.", "nf": 0}]}, {"name": "Equipements radio", "path": "xl/worksheets/sheet6.xml", "status": true, "fields": [{"id": "Equipements radio!3", "row": 3, "rub": "Équipements techniques radio", "sub": "Antennes radio", "label": "Nombre d’antennes", "fmt": "Nombre entier", "nf": 1}, {"id": "Equipements radio!4", "row": 4, "rub": "Équipements techniques radio", "sub": "Antennes radio", "label": "Référence des antennes", "fmt": "Référence(s)", "nf": 0}, {"id": "Equipements radio!5", "row": 5, "rub": "Équipements techniques radio", "sub": "Antennes radio", "label": "Bandes de fréquence des antennes", "fmt": "MHz / GHz", "nf": 0}, {"id": "Equipements radio!6", "row": 6, "rub": "Équipements techniques radio", "sub": "Antennes radio", "label": "HMA, orientation et position de chaque antenne sur plans", "fmt": "m / degrés / position", "nf": 0}, {"id": "Equipements radio!7", "row": 7, "rub": "Équipements techniques radio", "sub": "Antennes radio", "label": "Nombre de coaxiaux ou autres liaisons", "fmt": "Nombre entier", "note": "Operator privilégie les conceptions feederless", "nf": 1}, {"id": "Equipements radio!8", "row": 8, "rub": "Équipements techniques radio", "sub": "Faisceaux hertziens", "label": "Nombre de paraboles", "fmt": "Nombre entier", "nf": 1}, {"id": "Equipements radio!9", "row": 9, "rub": "Équipements techniques radio", "sub": "Faisceaux hertziens", "label": "Référence des paraboles ou faisceaux", "fmt": "Référence(s)", "nf": 0}, {"id": "Equipements radio!10", "row": 10, "rub": "Équipements techniques radio", "sub": "Faisceaux hertziens", "label": "Fréquence des faisceaux hertziens", "fmt": "GHz", "nf": 2}, {"id": "Equipements radio!11", "row": 11, "rub": "Équipements techniques radio", "sub": "Faisceaux hertziens", "label": "Diamètre de chaque parabole", "fmt": "m", "nf": 2}, {"id": "Equipements radio!12", "row": 12, "rub": "Équipements techniques radio", "sub": "Faisceaux hertziens", "label": "HMA, orientation et position de chaque parabole sur plans", "fmt": "m / degrés / position", "nf": 0}, {"id": "Equipements radio!13", "row": 13, "rub": "Équipements techniques radio", "sub": "Faisceaux hertziens", "label": "Nombre de coaxiaux", "fmt": "Nombre entier", "nf": 1}, {"id": "Equipements radio!14", "row": 14, "rub": "Équipements techniques radio", "sub": "Baies et coffrets, RRU inclus", "label": "Nombre de baies techniques ou coffrets", "fmt": "Nombre entier", "nf": 1}, {"id": "Equipements radio!15", "row": 15, "rub": "Équipements techniques radio", "sub": "Baies et coffrets, RRU inclus", "label": "Référence des baies ou coffrets", "fmt": "Référence(s)", "nf": 0}, {"id": "Equipements radio!16", "row": 16, "rub": "Équipements techniques radio", "sub": "Baies et coffrets, RRU inclus", "label": "Emprise au sol totale", "fmt": "m²", "nf": 2}, {"id": "Equipements radio!17", "row": 17, "rub": "Équipements techniques radio", "sub": "Baies et coffrets, RRU inclus", "label": "Localisation sur plans et positionnement indoor / outdoor", "fmt": "Position / type", "nf": 0}]}, {"name": "Gestion thermique", "path": "xl/worksheets/sheet7.xml", "status": true, "fields": [{"id": "Gestion thermique!3", "row": 3, "rub": "Infrastructures SPH", "sub": "Ventilation mécanique Contrôlée", "label": "État général du caisson VMC (corrosion, chocs, fixation).", "fmt": "Description", "spec": "Photographier le ventilateur. Contrôler la corrosion, les chocs, fissures, capotages, fixations, silentblocs, accessibilité et stabilité mécanique. Vérifier l’absence de pièce desserrée. Relever la marque, le modèle et le numéro de série. Moteur à entrainement direct ou poulie / courroie?", "nf": 1, "defst": "À renseigner"}, {"id": "Gestion thermique!4", "row": 4, "rub": "Infrastructures SPH", "sub": "Ventilation mécanique Contrôlée", "label": "Fonctionnement apparent du moteur (bruit anormal, vibrations excessives).", "fmt": "Description", "spec": "Si possible, mettre l’équipement en fonctionnement => Contrôler le démarrage, le sens apparent de l'air, les bruits (vibrations, frottements), odeurs anormales et échauffements. Préciser si le contrôle n’a pas pu être réalisé.", "nf": 0}, {"id": "Gestion thermique!5", "row": 5, "rub": "Infrastructures SPH", "sub": "Ventilation mécanique Contrôlée", "label": "État et propreté des filtres (encrassement, remplacement nécessaire).", "fmt": "Description", "spec": "Relever les dimensions (hauteur, largeur et épaisseur), la référence et la classe du filtre si visibles. Y-a-t-il des filtres et sont-ils adaptés?\nStandard TDF >> filtres en 600 x600 x48 (filtres plissés)", "nf": 1}, {"id": "Gestion thermique!6", "row": 6, "rub": "Infrastructures SPH", "sub": "Ventilation mécanique Contrôlée", "label": "État des gaines et raccordements (déconnexion, déchirure, écrasement).", "fmt": "Description", "spec": "Contrôler visuellement les gaines, manchettes souples, colliers, joints, supports et raccordements. Contrôle de l'étanchéité notamment aux jonctions, compris présence de scotch aluminium.", "nf": 0}, {"id": "Gestion thermique!7", "row": 7, "rub": "Infrastructures SPH", "sub": "Ventilation mécanique Contrôlée", "label": "Présence et dégagement des entrées/sorties d'air (absence d'obstruction).", "fmt": "Description", "spec": "Vérifier que les prises d’air, grilles, rejets et passages d’air sont présents, propres, non obstrués. Contrôler l’absence de végétation, déchets, stockage, câble ou chemin de câbles, équipement gênant. Vérifier l’absence de reprise directe de l’air chaud rejeté.\nle DTU demande 8 m entre une entrée et une sortie sauf si l'on est pas sur la même façade", "nf": 1}, {"id": "Gestion thermique!8", "row": 8, "rub": "Infrastructures SPH", "sub": "Ventilation mécanique Contrôlée", "label": "Alimentation électrique et protection (câblage propre, absence d'échauffement visible).", "fmt": "Description", "spec": "Identifier le départ électrique et l’organe de protection associés. Contrôler visuellement le câblage, les presse-étoupes, borniers, capots, mise à la terre, repérage, protection mécanique et traces d’échauffement. Relever le calibre du disjoncteur/ vérifeir la présence d'un interrupteur de proximité si nécessaire\nUn interrupteur de proximité est obligatoire si le moteur n'est pas en regard direct du tableau sur lequel il est raccordé", "nf": 0}, {"id": "Gestion thermique!9", "row": 9, "rub": "Infrastructures SPH", "sub": "Climatisation", "label": "État de l'unité intérieure et extérieure (corrosion, détérioration, fixation).", "fmt": "Description", "spec": "Recensement des unités intérieures et extérieures. Contrôler corrosion, chocs, capotage, échangeurs, grilles, fixations, supports, silentblocs et accessibilité pour maintenance. Photographier chaque unité et chaque plaque signalétiques\nphoto des unités extérieures obligatoires pour mettre en place les actions normatives (DESP, FGAS)", "nf": 1}, {"id": "Gestion thermique!10", "row": 10, "rub": "Infrastructures SPH", "sub": "Climatisation", "label": "Fonctionnement apparent (voyants, affichage, absence d'alarme).", "fmt": "Description", "spec": "Contrôler l’état des voyants. Vérifier l'absence de codes défaut, vérifier le démarrage et le fonctionnement en mode froid si les conditions le permettent. Contrôler le soufflage, les bruits, vibrations et arrêts intempestifs. Tester alternativement chaque unité lorsqu’un fonctionnement principal/secours est prévu.\nAttention qu'il n'y ait pas d'obstacle devant les unités intérieures et extérieures => pannes. Un climatiseur qui démarre et s'arrête rapidement est signe de sous-dimensionnement ou fuite de fluide", "nf": 0}, {"id": "Gestion thermique!11", "row": 11, "rub": "Infrastructures SPH", "sub": "Climatisation", "label": "Température ambiante du local (cohérente avec la consigne d'exploitation).", "fmt": "° Celsius", "spec": "Mesurer la température ambiante, les températures de soufflage et reprise", "nf": 1}, {"id": "Gestion thermique!12", "row": 12, "rub": "Infrastructures SPH", "sub": "Climatisation", "label": "État des filtres et échangeurs (propreté, encrassement).", "fmt": "Description", "spec": "Contrôler les filtres, batteries et échangeurs des unités intérieure et extérieure. Rechercher encrassement, poussières, feuilles, corrosion, ailettes écrasées et obstruction.", "nf": 0}, {"id": "Gestion thermique!13", "row": 13, "rub": "Infrastructures SPH", "sub": "Climatisation", "label": "Présence de fuites (eau de condensation ou traces d'huile frigorifique).", "fmt": "Description", "spec": "Rechercher les traces d’eau, condensats, huile frigorifique, coulures, corrosion et auréoles sur ou sous les équipements, liaisons et raccords. Contrôler le bac à condensats, la pompe de relevage éventuelle et l’évacuation jusqu’à l'évacuation. Photographier toute trace suspecte (toute trace de gras est signe de fuite de fluide frigorigène)", "nf": 1}, {"id": "Gestion thermique!14", "row": 14, "rub": "Infrastructures SPH", "sub": "Climatisation", "label": "État des liaisons frigorifiques et électriques (isolation, fixation, absence de dégradation).", "fmt": "Description", "spec": "Contrôler l’état, la fixation et le cheminement des liaisons frigorifiques et électriques. Vérifier l'état du calorifuge des liaisons frigorifiques , l'existance d'une protection UV, traversées de paroi, rayons de courbure, raccordements et absence d’écrasement ou d'angle trop important. Rechercher les traces d’huile, condensation et corrosion. Mesurer les longueurs entre les unités intérieure et extérieure", "nf": 0}]}, {"name": "Sécurité incendie", "path": "xl/worksheets/sheet8.xml", "status": true, "fields": [{"id": "Sécurité incendie!3", "row": 3, "rub": "Infrastructures SPH", "sub": "Détection incendie", "label": "Présence des détecteurs prévus au plan (fumée, thermique, multicritères).", "fmt": "Description", "nf": 0}, {"id": "Sécurité incendie!4", "row": 4, "rub": "Infrastructures SPH", "sub": "Détection incendie", "label": "État physique des détecteurs (propreté, absence de détérioration).", "fmt": "Description", "nf": 1}, {"id": "Sécurité incendie!5", "row": 5, "rub": "Infrastructures SPH", "sub": "Détection incendie", "label": "Voyants de la centrale incendie (absence de défaut ou d'alarme permanente).", "fmt": "Description", "nf": 0}, {"id": "Sécurité incendie!6", "row": 6, "rub": "Infrastructures SPH", "sub": "Détection incendie", "label": "Accessibilité de la centrale et des équipements.", "fmt": "Position", "nf": 1}, {"id": "Sécurité incendie!7", "row": 7, "rub": "Infrastructures SPH", "sub": "Détection incendie", "label": "Présence des déclencheurs manuels et signalisation.", "fmt": " const XF=PVCI.tabs.flatMap((t,ti)=>t.fields.map(f=>Object.assign({},f,{tab:t.name,ti,hasSt:t.status})));
const isIGField=f=>f.tab==="Identification"&&/\(IG\)/.test(f.label);
function xr(id){return state.xl[id]||(state.xl[id]={})}
function xget(id){return (state.xl&&state.xl[id])||{}}
function xVal(f){return isIGField(f)?state.ig:(xget(f.id).v||"")}
function xDone(f){const r=xget(f.id);return f.hasSt?!!r.st:!!String(r.v||"").trim()}
function xAny(){return Object.values(state.xl||{}).some(r=>r&&(String(r.v||"").trim()||r.st||String(r.cm||"").trim()))}
let xSaveT=null;
function xSave(){clearTimeout(xSaveT);xSaveT=setTimeout(lsSet,250);xPrepared=null;const b=$("#xExp");if(b)b.textContent="Exporter l'Excel";if(typeof resetSend==="function")resetSend()}
function kind(f){
  if(isIGField(f))return "ig";
  if(f.yn)return "yn";
  const t=f.fmt;
  if(t==="Nombre entier")return "int";
  if(t==="jj/mm/aaaa"||t==="Date")return "date";
  if(t==="L x l x h")return "dim3";
  if(t==="L x l / m²")return "dim2";
  if(t==="Degrés décimaux")return "gps";
  if(f.tab==="Identification"&&f.label==="Altitude")return "alt";
  if(["m","A","GHz","m²","° Celsius"].includes(t))return "num";
  if(t==="Code postal")return "cp";
  if(/Description|Texte détaillé|Type \/ dimensions|Téléphone|Présence et type/.test(t)||f.tab==="Moyen d'accès")return "area";
  return "text";
}
const fr=n=>String(n).replace(".",",");
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:null};
function xClass(f){const r=xget(f.id);if(r.st==="Non conforme")return " nok";if(r.st==="Sans objet")return " so";if(r.st==="Conforme")return " ok";if(!f.hasSt&&String(r.v||"").trim())return " filled";return ""}
function xIn(attrs){return `<input class="xin" ${attrs}>`}
function renderXItem(f){
  const r=xget(f.id),k=kind(f);const el=document.createElement("div");el.className="xitem"+xClass(f);
  let inp="";
  if(k==="ig")inp=`<div class="xrow">${xIn(`value="${esc(state.ig)}" readonly`)}<span class="u">= code IG</span></div>`;
  else if(k==="yn")inp=`<div class="chips ynx">${["Oui","Non","Sans objet"].map(v=>`<button data-v="${v}" class="${r.v===v?"on":""}">${v}</button>`).join("")}</div>`;
  else if(k==="int")inp=xIn(`data-k="v" inputmode="numeric" pattern="[0-9]*" value="${esc(r.v||"")}" placeholder="0"`);
  else if(k==="num")inp=`<div class="xrow">${xIn(`data-k="v" inputmode="decimal" value="${esc(r.v||"")}"`)}<span class="u">${esc(f.fmt)}</span></div>`;
  else if(k==="cp")inp=xIn(`data-k="v" inputmode="numeric" maxlength="5" value="${esc(r.v||"")}"`);
  else if(k==="date")inp=`<div class="xrow">${xIn(`data-k="d" type="date" value="${esc(r.p||"")}"`)}<button class="tog" data-a="today">Aujourd'hui</button></div>`;
  else if((k==="dim3"||k==="dim2")&&r.v&&!r.p)inp=xIn(`data-k="v" value="${esc(r.v)}"`);
  else if(k==="dim3"){const p=r.p||[];inp=`<div class="xrow">${["L","l","h"].map((n,i)=>xIn(`class="xin mini" data-k="p${i}" inputmode="decimal" placeholder="${n}" value="${esc(p[i]||"")}"`)).join('<span class="x">×</span>')}<span class="u">m</span></div>`}
  else if(k==="dim2"){const p=r.p||[];inp=`<div class="xrow">${["L","l"].map((n,i)=>xIn(`class="xin mini" data-k="p${i}" inputmode="decimal" placeholder="${n}" value="${esc(p[i]||"")}"`)).join('<span class="x">×</span>')}<span class="u">m</span><span class="u" data-area>${esc(r.area||"")}</span></div>`}
  else if(k==="gps"||k==="alt")inp=`<div class="xrow">${xIn(`data-k="v" inputmode="decimal" value="${esc(r.v||"")}" placeholder="${k==="alt"?"m":"ex. 44,8378"}"`)}<button class="tog" data-a="gps">Position GPS</button></div>`;
  else if(k==="area")inp=`<textarea class="xin" data-k="v" rows="2">${esc(r.v||"")}</textarea>`;
  else inp=xIn(`data-k="v" value="${esc(r.v||"")}"`);
  const st=f.hasSt?`<div class="chips stx">${["Conforme","Non conforme","Sans objet"].map(v=>`<button data-v="${v}" class="${r.st===v?"on":""}">${v}</button>`).join("")}</div>`:"";
  const showCm=f.hasSt&&(r.st==="Non conforme"||String(r.cm||"").trim()||r.cmOpen);
  el.innerHTML=`<div class="xlab"><b>${esc(f.label)}</b><span class="xfmt">${esc(f.fmt)}</span></div>${inp}${st}
  ${f.hasSt?(showCm?`<textarea class="xin" data-k="cm" rows="2" placeholder="Commentaire${r.st==="Non conforme"?" : décris l'écart":""}">${esc(r.cm||"")}</textarea>`:`<button class="linkbtn" data-a="cm">+ Commentaire</button>`):""}
  ${f.note?`<div class="xnote">Note du modèle : ${esc(f.note)}</div>`:""}
  ${f.spec?`<details class="spec"><summary>Référence TDF (site standard)</summary><div>${esc(f.spec)}</div></details>`:""}`;
  // events
  el.querySelectorAll("[data-k]").forEach(i=>i.addEventListener("input",()=>{
    const rec=xr(f.id),key=i.dataset.k;
    if(key==="v")rec.v=i.value;
    else if(key==="cm")rec.cm=i.value;
    else if(key==="d"){rec.p=i.value;rec.v=i.value?i.value.split("-").reverse().join("/"):""}
    else if(key[0]==="p"){rec.p=rec.p||[];rec.p[+key[1]]=i.value.trim();
      const P=rec.p.map(num);
      if(k==="dim3")rec.v=rec.p.filter(Boolean).length?`${rec.p.map(x=>x||"?").join(" x ")} m`:"";
      else{const a=(P[0]!=null&&P[1]!=null)?Math.round(P[0]*P[1]*100)/100:null;rec.area=a!=null?`= ${fr(a)} m²`:"";
        rec.v=rec.p.filter(Boolean).length?`${rec.p.map(x=>x||"?").join(" x ")} m`+(a!=null?` / ${fr(a)} m²`:""):"";
        const ar=el.querySelector("[data-area]");if(ar)ar.textContent=rec.area}}
    xSave();el.className="xitem"+xClass(f);xCounts(f.ti);
  }));
  el.querySelectorAll(".stx button").forEach(b=>b.onclick=()=>{const rec=xr(f.id);rec.st=rec.st===b.dataset.v?"":b.dataset.v;xSave();xRedraw(f)});
  el.querySelectorAll(".ynx button").forEach(b=>b.onclick=()=>{const rec=xr(f.id);rec.v=rec.v===b.dataset.v?"":b.dataset.v;if(rec.v==="Sans objet"&&!rec.st)rec.st="Sans objet";xSave();xRedraw(f)});
  const cb=el.querySelector('[data-a="cm"]');if(cb)cb.onclick=()=>{xr(f.id).cmOpen=1;xRedraw(f,true)};
  const tb=el.querySelector('[data-a="today"]');if(tb)tb.onclick=()=>{const d=new Date(),iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;const rec=xr(f.id);rec.p=iso;rec.v=iso.split("-").reverse().join("/");xSave();xRedraw(f)};
  const gb=el.querySelector('[data-a="gps"]');if(gb)gb.onclick=()=>xGps(gb);
  el._f=f;return el;
}
function xRedraw(f,focusCm){const old=[...document.querySelectorAll("#xlist .xitem")].find(e=>e._f&&e._f.id===f.id);if(!old)return;const n=renderXItem(f);old.replaceWith(n);xCounts(f.ti);if(focusCm){const t=n.querySelector('[data-k="cm"]');if(t)t.focus()}}
function xGps(btn){
  if(!navigator.geolocation){msg("Position GPS indisponible sur cet appareil.");return}
  btn.disabled=true;msg("Recherche de la position GPS…");
  navigator.geolocation.getCurrentPosition(p=>{
    const c=p.coords,F=n=>XF.find(f=>f.tab==="Identification"&&f.label===n);
    const set=(f,v)=>{if(f&&v!=null){xr(f.id).v=v}};
    set(F("Latitude"),c.latitude.toFixed(6).replace(".",","));set(F("Longitude"),c.longitude.toFixed(6).replace(".",","));
    if(c.altitude!=null)set(F("Altitude"),String(Math.round(c.altitude)));
    xSave();["Latitude","Longitude","Altitude"].forEach(n=>{const f=F(n);if(f)xRedraw(f)});
    msg(`Position relevée (précision ± ${Math.round(c.accuracy)} m)`+(c.altitude==null?". Altitude non fournie par le téléphone.":"."));
  },e=>{btn.disabled=false;msg(e.code===1?"Accès à la position refusé : autorise la localisation pour cette appli dans les réglages.":"Position introuvable, réessaie à découvert.")},{enableHighAccuracy:true,timeout:20000,maximumAge:0});

  if(mode==="cancel"||!res){msg("Import annulé.");return}
  if(mode==="replace"){const keep={};XF.filter(f=>/signataire MOE/.test(f.label)).forEach(f=>{if(xget(f.id).v)keep[f.id]={v:xget(f.id).v}});state.xl=Object.assign(keep,res.xl);
    Object.keys(res.st).forEach(c=>state.st[c]=res.st[c]);Object.keys(res.cm).forEach(c=>state.cm[c]=res.cm[c])}
  else{Object.entries(res.xl).forEach(([id,rec])=>{const cur=state.xl[id]||(state.xl[id]={});Object.entries(rec).forEach(([k,v])=>{if(cur[k]==null||cur[k]===""||(Array.isArray(cur[k])&&!cur[k].some(Boolean)))cur[k]=v})});
    Object.keys(res.st).forEach(c=>{if(!state.st[c])state.st[c]=res.st[c]});Object.keys(res.cm).forEach(c=>{if(!state.cm[c])state.cm[c]=res.cm[c]})}
  if(res.ig&&!state.ig){state.ig=res.ig;$("#ig").value=res.ig}
  if(res.photos&&res.photos.length){
    if(mode==="replace"){photos.forEach(p=>{if(urls.has(p.id)){URL.revokeObjectURL(urls.get(p.id));urls.delete(p.id)}});photos=[];idb("readwrite",s=>s.clear())}
    const have=new Set(photos.map(p=>nameOf(p)));const t0=Date.now();
    res.photos.sort((a,b)=>a.code.localeCompare(b.code)||a.idx-b.idx).forEach((q,i)=>{
      if(have.has(q.name))return;
      if(!ITEMS[q.code]&&!state.extra.includes(q.code))state.extra.push(q.code);
      const p={id:t0+"-"+i+"-"+Math.random().toString(36).slice(2,6),item:q.code,blob:q.blob,ts:t0+i,saved:true};photos.push(p);idb("readwrite",s=>s.put(p));
      if(!state.st[q.code])state.st[q.code]="OK"})}
  lsSet();xSave();render();renderX();renderHome();setView("excel");
  msg(`Import terminé : ${res.count} élément${res.count>1?"s":""} repris.`+(res.skipped.length?` Lignes ignorées : ${res.skipped.slice(0,3).join(", ")}${res.skipped.length>3?"…":""}.`:""));
}

function xlsxName(){return `${state.ig}_PVCI_${today()}.xlsx`}
function xCsv(){const rows=[["Onglet","Rubrique","Champ","Valeur","Statut","Commentaire"]];XF.forEach(f=>{const r=xget(f.id);rows.push([f.tab,f.sub,f.label,xVal(f),r.st||"",r.cm||""])});return "﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n")}
async function addPvci(zip){
  try{zip.file(xlsxName(),new Uint8Array(await (await buildPvciXlsx()).arrayBuffer()))}
  catch(e){zip.file(`${state.ig}_PVCI_saisie_${today()}.csv`,xCsv())}
}
let xPrepared=null;
$("#xExp").onclick=async()=>{
  const b=$("#xExp");
  if(!state.ig){msg("Renseigne le code IG avant d'exporter.");$("#ig").focus();return}
  if(!xPrepared){
    b.disabled=true;msg("Préparation de l'Excel…");
    try{
      const blob=await buildPvciXlsx();const name=xlsxName();const file=new File([blob],name,{type:XLSX_MIME});
      let ok=false;try{ok=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
      if(ok){xPrepared=file;b.textContent="Partager l'Excel";msg(`${name} prêt. Appuie sur « Partager l'Excel » : Enregistrer dans Fichiers, Mail, Teams…`)}
      else{download(name,blob);msg("Excel téléchargé : "+name)}
    }catch(e){msg("Export Excel impossible : "+(e&&e.message||"erreur")+".")}
    finally{b.disabled=false}
    return;
  }
  try{await navigator.share({files:[xPrepared],title:`PVCI ${state.ig}`});msg("Excel partagé.")}
  catch(e){msg(e&&e.name==="AbortError"?"Partage annulé.":"Partage impossible ("+(e&&e.name||"erreur")+").")}
  xPrepared=null;b.textContent="Exporter l'Excel";
};

(async()=>{
  lsGet();if(!state.v3){state.saveEach=false;state.v3=1;lsSet()}if(!state.xl)state.xl={};$("#ig").value=state.ig;render();renderX();setView(state.view||"home",true);
  const all=await idb("readonly",s=>s.getAll());if(all&&all.length){photos=all;render();renderHome();msg(`${all.length} photo(s) restaurée(s) de la session précédente.`)}
})();
</script>
