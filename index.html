<script>
// Mini ZIP (sans compression, format standard) : remplace JSZip pour fonctionner hors ligne
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function dosTime(d){return ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF}
function dosDate(d){return (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF}
class JSZip{
  constructor(){this.entries=[]}
  file(name,data,opts){this.entries.push({name,data,date:(opts&&opts.date)||new Date()});return this}
  async generateAsync(){
    const enc=new TextEncoder();const parts=[];const central=[];let offset=0;
    for(const e of this.entries){
      const nameB=enc.encode(e.name);
      const u8=typeof e.data==="string"?enc.encode(e.data):new Uint8Array(await e.data.arrayBuffer());
      const crc=crc32(u8),t=dosTime(e.date),d=dosDate(e.date);
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
      lh.setUint16(10,t,true);lh.setUint16(12,d,true);lh.setUint32(14,crc,true);lh.setUint32(18,u8.length,true);lh.setUint32(22,u8.length,true);
      lh.setUint16(26,nameB.length,true);lh.setUint16(28,0,true);
      parts.push(lh.buffer,nameB,u8);
      const ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
      ch.setUint16(12,t,true);ch.setUint16(14,d,true);ch.setUint32(16,crc,true);ch.setUint32(20,u8.length,true);ch.setUint32(24,u8.length,true);
      ch.setUint16(28,nameB.length,true);ch.setUint32(42,offset,true);
      central.push(ch.buffer,nameB);
      offset+=30+nameB.length+u8.length;
    }
    const cdSize=central.reduce((a,b)=>a+(b.byteLength),0);
    const end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);end.setUint16(8,this.entries.length,true);end.setUint16(10,this.entries.length,true);
    end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
    return new Blob([...parts,...central,end.buffer],{type:"application/zip"});
  }
}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
// Téléchargement direct (navigateur)
function download(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
const DL={save:async({filename,data})=>{download(filename,data instanceof Blob?data:new Blob([data]));return{status:"saved"}}};

function lsSet(){try{localStorage.setItem("pvci_pwa_state",JSON.stringify(state))}catch(e){}}

// IndexedDB pour garder les photos si l'onglet se ferme
let dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise((res)=>{try{const r=indexedDB.open("pvci_pwa_photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
async function idb(mode,fn){const d=await db();if(!d)return null;return new Promise(res=>{try{const t=d.transaction("p",mode);const r=fn(t.objectStore("p"));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>res(null)}catch(e){res(null)}})}

function cleanIG(v){return v.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9-]/g,"").toUpperCase()}
function cleanCode(v){return v.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_-]+/g,"_").replace(/^_+|_+$/g,"")}
function itemPhotos(c){return photos.filter(p=>p.item===c).sort((a,b)=>a.ts-b.ts)}
function fileName(c,idx,total){const it=ITEMS[c];const ig=state.ig||"IG";return `${ig}_${c}${idx>0?"_"+(idx+1):""}${it&&it.g?"_GEN":""}.jpg`}
function nextName(c){const n=itemPhotos(c).length;return fileName(c,n,n+1)}

function allCodes(){return [...Object.keys(ITEMS),...state.extra]}
function render(){
  const list=$("#list");const openSet=new Set([...list.querySelectorAll("details[open]")].map(d=>d.dataset.s));
  const first=!list.children.length;
  list.innerHTML="";
  const groups=[...SECTIONS.map(([s,a])=>[s,a.map(x=>x[0])]),["Photos libres",state.extra]];
  groups.forEach(([s,codes],gi)=>{
    const d=document.createElement("details");d.className="sec";d.dataset.s=s;
    if(openSet.has(s)||(first&&gi===0))d.open=true;
    const done=codes.filter(isDone).length;
    d.innerHTML=`<summary><h2>${s}</h2><span class="sc">${done}/${codes.length}</span></summary>`;
    codes.forEach(c=>{if(filterTodo&&isDone(c))return;d.appendChild(renderItem(c))});
    if(s==="Photos libres"){const a=document.createElement("div");a.className="addlib";
      a.innerHTML=`<input id="libName" placeholder="Nom de la photo (ex. Fissure_Terrasse)"><button class="tog" id="libAdd">Ajouter la ligne</button>`;
      d.appendChild(a);
      a.querySelector("#libAdd").onclick=()=>{const v=cleanCode(a.querySelector("#libName").value);if(!v)return;if(!ITEMS[v]&&!state.extra.includes(v)){state.extra.push(v);lsSet()}d.open=true;render()};
    }
    list.appendChild(d);
  });
  const rules=document.createElement("div");rules.className="sec rules";
  rules.innerHTML=`<div>Nommage : <code>CodeIG_Désignation.jpg</code>, vue d'ensemble : <code>CodeIG_Acces_VueGenerale_GEN.jpg</code>.</div><div>Plusieurs photos sur une ligne : la 1re garde le nom de base, les suivantes prennent <code>_2</code>, <code>_3</code>… pour éviter les doublons (sinon seule la plus récente est gardée).</div><div>JPEG, réduit automatiquement sous 3 Mo (photo d'origine conservée si déjà conforme).</div><div>Sauvegarde en cours de visite : « Vers la galerie » envoie toutes les nouvelles photos d'un coup (iPhone : « Enregistrer les images »), « Sauvegarder (1 ZIP) » les range dans Fichiers.</div><div>Version 1.2 · envoi du ZIP final par mail avec le bouton « Envoyer ».</div><div>Installer l'appli : iPhone, Safari → Partager → « Sur l'écran d'accueil ». Android, Chrome → menu ⋮ → « Installer l'application ». Elle marche ensuite sans réseau.</div>`;
  list.appendChild(rules);
  stats();
}
function isDone(c){return itemPhotos(c).length>0||state.st[c]==="SO"}
function renderItem(c){
  const it=ITEMS[c]||{c,l:c,g:false};const ps=itemPhotos(c);const st=state.st[c]||"";
  const el=document.createElement("div");
  el.className="item"+(st==="SO"?" isso":st==="NOK"?" isnok":ps.length?" done":"");
  const label=it.l!==c?`<b>${esc(it.l)}</b>`:`<b>${esc(c)}</b>`;
  el.innerHTML=`<div class="ihead"><div class="ilabel">${label}<div class="fname">${esc(nextName(c))}</div></div>
  <button class="shoot" data-a="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo</button></div>
  <div class="row2"><div class="st">${["SO","OK","NOK"].map(v=>`<button data-v="${v}" class="${st===v?"on":""}">${v}</button>`).join("")}</div>
  <button class="tog" data-a="gal">Depuis la galerie</button></div>
  ${ps.length?`<div class="gallery">${ps.map((p,i)=>`<div class="ph"><img alt="" src="${url(p)}"><button class="del" data-id="${p.id}" aria-label="Supprimer">✕</button><span>${i>0?"_"+(i+1):"n°1"} · ${(p.blob.size/1048576).toFixed(1)} Mo</span><button class="tog sv${p.saved?" ok":""}" data-id="${p.id}">${p.saved?"✓ Sur le tél.":"Enregistrer"}</button></div>`).join("")}</div>`:""}
  ${st==="NOK"||state.cm[c]?`<input class="cmt" placeholder="Commentaire" value="${esc(state.cm[c]||"")}">`:""}`;
  el.querySelector('[data-a="cam"]').onclick=()=>pick("#cam",c);
  el.querySelector('[data-a="gal"]').onclick=()=>pick("#gal",c);
  el.querySelectorAll(".st button").forEach(b=>b.onclick=()=>{state.st[c]=state.st[c]===b.dataset.v?"":b.dataset.v;lsSet();render()});
  el.querySelectorAll(".del").forEach(b=>b.onclick=()=>delPhoto(b.dataset.id));
  el.querySelectorAll(".sv").forEach(b=>b.onclick=()=>{const p=photos.find(x=>x.id===b.dataset.id);if(p)saveOne(p)});
  const cm=el.querySelector(".cmt");if(cm)cm.oninput=()=>{state.cm[c]=cm.value;lsSet()};
  return el;
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function url(p){if(!urls.has(p.id))urls.set(p.id,URL.createObjectURL(p.blob));return urls.get(p.id)}
function stats(){
  const codes=allCodes();const done=codes.filter(isDone).length;
  $("#prog").style.width=(codes.length?done/codes.length*100:0)+"%";
  const nSaved=photos.filter(p=>p.saved).length, miss=photos.length-nSaved;
  $("#count").textContent=`${photos.length} photo${photos.length>1?"s":""} · ${done}/${codes.length} lignes · ${nSaved} sur le tél.`;
  if(typeof prepared!=="undefined"&&prepared&&prepared.count!==photos.length){prepared=null;const sb=document.getElementById("send");if(sb)sb.textContent="Envoyer"}
  const gb=$("#fGallery");gb.hidden=!miss||savingAll;gb.textContent=`Vers la galerie (${miss})`;
  const mb=$("#fMissing");mb.hidden=!miss||savingAll;mb.textContent=`Sauvegarder ${miss} nouvelle${miss>1?"s":""} photo${miss>1?"s":""} (1 ZIP)`;mb.classList.toggle("urgent",miss>=15);
  const fs=$("#fSave");fs.setAttribute("aria-pressed",state.saveEach===true);fs.textContent="Copie photo par photo : "+(state.saveEach===true?"activée":"désactivée");
  $("#ig").classList.toggle("empty",!state.ig);
}

let target=null;
function pick(sel,c){target=c;const i=$(sel);i.value="";i.click()}
async function onFiles(e){
  const files=[...e.target.files];if(!files.length||!target)return;const c=target;
  msg(`Traitement de ${files.length} photo${files.length>1?"s":""}…`);
  for(const f of files){
    try{const blob=await toJpeg(f);const p={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),item:c,blob,ts:Date.now()};
      photos.push(p);await idb("readwrite",s=>s.put(p));
      if(state.saveEach===true){render();await saveOne(p)}}
    catch(err){msg("Impossible de lire "+f.name+". Essaie depuis la galerie.");continue}
  }
  if(state.st[c]===""||!state.st[c]){state.st[c]="OK";lsSet()}
  if(state.saveEach!==true){const miss=photos.filter(p=>!p.saved).length;msg(`Ajoutée : ${fileName(c,itemPhotos(c).length-1,itemPhotos(c).length)}`+(miss>=15?` · ${miss} photos non sauvegardées, pense à faire une sauvegarde.`:""))}
  render();
}
$("#cam").onchange=onFiles;$("#gal").onchange=onFiles;

async function toJpeg(f){
  if((f.type==="image/jpeg"||/\.jpe?g$/i.test(f.name))&&f.size<=MAX_BYTES)return f.slice(0,f.size,"image/jpeg");
  let bmp;
  try{bmp=await createImageBitmap(f,{imageOrientation:"from-image"})}
  catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(f)})}
  const w=bmp.width,h=bmp.height;let scale=Math.min(1,MAX_SIDE/Math.max(w,h));
  for(let attempt=0;attempt<6;attempt++){
    const cv=document.createElement("canvas");cv.width=Math.round(w*scale);cv.height=Math.round(h*scale);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    for(const q of [0.88,0.8,0.72]){
      const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));
      if(b&&b.size<=MAX_BYTES)return b;
    }
    scale*=0.8;
  }
  throw new Error("trop lourde");
}
async function delPhoto(id){
  photos=photos.filter(p=>p.id!==id);if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}
  await idb("readwrite",s=>s.delete(id));render();
}
function msg(t){$("#msg").textContent=t}
function nameOf(p){const ps=itemPhotos(p.item);const i=ps.indexOf(p);return fileName(p.item,i,ps.length)}
let savingAll=false;
async function saveOne(p){
  if(!state.ig){msg("Renseigne le code IG : la photo est gardée dans l'audit, tu pourras l'enregistrer ensuite avec « Enregistrer les manquantes ».");return "noig"}
  const dl=DL;
  if(!dl){msg("Enregistrement indisponible dans cette vue.");return "off"}
  const name=nameOf(p);
  try{await dl.save({filename:name,data:p.blob});p.saved=true;await idb("readwrite",s=>s.put(p));msg("Enregistrée sur le téléphone : "+name);render();return "ok"}
  catch(e){const c=e&&e.code;msg(c==="declined"?"Non enregistrée sur le téléphone : "+name+" (elle reste dans l'audit).":c==="rate_limited"?"Une demande d'enregistrement est déjà ouverte. Réessaie avec « Enregistrer les manquantes ».":"Enregistrement impossible ("+(c||"erreur")+").");return c||"err"}
}
async function saveMissing(){
  if(savingAll)return;
  if(!state.ig){msg("Renseigne le code IG avant de sauvegarder, pour que les photos aient le bon nom.");$("#ig").focus();return}
  
  const dl=DL;
  if(!dl){msg("Sauvegarde indisponible dans cette vue.");return}
  const todo=photos.filter(p=>!p.saved);if(!todo.length)return;
  savingAll=true;render();msg("Préparation de la sauvegarde…");
  try{
    const zip=new JSZip();todo.forEach(p=>zip.file(nameOf(p),p.blob,{date:new Date(p.ts)}));
    const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
    const d=new Date(),hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");
    await dl.save({filename:`${state.ig}_sauvegarde_${hh}h${mm}.zip`,data:blob});
    for(const p of todo){p.saved=true;await idb("readwrite",s=>s.put(p))}
    msg(`${todo.length} photo${todo.length>1?"s":""} sauvegardée${todo.length>1?"s":""} sur le téléphone (${state.ig}_sauvegarde_${hh}h${mm}.zip).`);
  }catch(e){const c=e&&e.code;msg(c==="declined"?"Sauvegarde annulée : les photos restent dans l'audit.":c==="rate_limited"?"Une demande est déjà ouverte, réessaie dans un instant.":"Sauvegarde impossible ("+(c||"erreur")+").")}
  finally{savingAll=false;render()}
}
$("#fMissing").onclick=saveMissing;
function canShareFiles(){try{return !!(navigator.canShare&&navigator.canShare({files:[new File([new Blob(["x"],{type:"image/jpeg"})],"t.jpg",{type:"image/jpeg"})]}))}catch(e){return false}}
const SHARE_OK=canShareFiles();
async function toGallery(){
  if(!state.ig){msg("Renseigne le code IG avant d'enregistrer, pour que les photos aient le bon nom.");$("#ig").focus();return}
  const todo=photos.filter(p=>!p.saved);if(!todo.length)return;
  const files=todo.map(p=>new File([p.blob],nameOf(p),{type:"image/jpeg",lastModified:p.ts}));
  if(SHARE_OK){
    try{await navigator.share({files});
      for(const p of todo){p.saved=true;await idb("readwrite",s=>s.put(p))}
      msg(`${todo.length} photo${todo.length>1?"s":""} envoyée${todo.length>1?"s":""}. Sur iPhone, choisis « Enregistrer ${todo.length>1?todo.length+" images":"l'image"} » pour la galerie.`);
    }catch(e){msg(e&&e.name==="AbortError"?"Envoi annulé : les photos restent dans l'audit.":"Envoi impossible ("+(e&&e.name||"erreur")+").")}
  }else{
    for(const [i,p] of todo.entries()){download(nameOf(p),p.blob);p.saved=true;await idb("readwrite",s=>s.put(p));if(i<todo.length-1)await new Promise(r=>setTimeout(r,350))}
    msg(`${todo.length} photo${todo.length>1?"s":""} téléchargée${todo.length>1?"s":""} : elles apparaissent dans la galerie (dossier Download).`);
  }
  render();
}
$("#fGallery").onclick=toGallery;
// --- Envoi du ZIP final (mail, Outlook, Gmail, WeTransfer, Teams...) en 2 temps : préparer puis envoyer ---
let prepared=null;
function resetSend(){prepared=null;const b=$("#send");if(b)b.textContent="Envoyer"}
async function buildExportZip(){
  const zip=new JSZip();const rows=[["Section","Désignation","Statut","Nb photos","Fichiers","Commentaire"]];
  const groups=[...SECTIONS.map(([s,a])=>[s,a.map(x=>x[0])]),["Photos libres",state.extra]];
  groups.forEach(([s,codes])=>codes.forEach(c=>{
    const ps=itemPhotos(c);const names=ps.map((p,i)=>fileName(c,i,ps.length));
    ps.forEach((p,i)=>zip.file(names[i],p.blob,{date:new Date(p.ts)}));
    rows.push([s,(ITEMS[c]||{l:c}).l,state.st[c]||"",ps.length,names.join(" | "),state.cm[c]||""]);
  }));
  zip.file(`${state.ig}_recap_photos.csv`,"﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"));
  return zip.generateAsync();
}
$("#send").onclick=async()=>{
  const b=$("#send");
  if(!state.ig){msg("Renseigne le code IG avant d'envoyer.");$("#ig").focus();return}
  if(!photos.length){msg("Aucune photo à envoyer.");return}
  if(prepared&&prepared.count!==photos.length)resetSend();
  if(!prepared){
    b.disabled=true;msg("Préparation de l'envoi…");
    try{
      const blob=await buildExportZip();
      const file=new File([blob],`${state.ig}_photos_audit_${today()}.zip`,{type:"application/zip"});
      prepared={file,count:photos.length};
      const mb_=blob.size/1048576,mo=mb_<10?mb_.toFixed(1).replace(".",","):mb_.toFixed(0);
      b.textContent=`Envoyer (${mo} Mo)`;
      msg(blob.size>20*1048576
        ?`ZIP prêt : ${mo} Mo, trop lourd pour une pièce jointe classique (limite ~20 Mo). Appuie sur « Envoyer », puis choisis Outlook ou Gmail (ils le transforment en lien OneDrive / Drive) ou WeTransfer.`
        :`ZIP prêt : ${mo} Mo. Appuie sur « Envoyer » et choisis ta messagerie.`);
    }catch(e){msg("Préparation impossible ("+(e&&e.message||"erreur")+").");resetSend()}
    finally{b.disabled=false}
    return;
  }
  const data={files:[prepared.file],title:`Photos audit ${state.ig}`,text:`Reportage photos PVCI - site ${state.ig} (${prepared.count} photos + récap CSV).`};
  let ok=false;try{ok=!!(navigator.canShare&&navigator.canShare(data))}catch(e){}
  if(ok){
    try{await navigator.share(data);msg("Envoi lancé. Vérifie l'envoi dans ta messagerie.");resetSend()}
    catch(e){msg(e&&e.name==="AbortError"?"Envoi annulé. Appuie de nouveau sur « Envoyer » pour réessayer.":"Envoi impossible ("+(e&&e.name||"erreur")+"). Utilise « Exporter le ZIP » puis joins-le à ton mail.")}
  }else{
    download(prepared.file.name,prepared.file);
    msg("Ce navigateur ne peut pas ouvrir la messagerie directement : le ZIP est téléchargé, joins-le à ton mail depuis Téléchargements.");
    resetSend();
  }
};
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;$("#install").hidden=false});
$("#install").onclick=async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;$("#install").hidden=true};
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

$("#ig").value=state.ig;
$("#ig").oninput=e=>{const v=cleanIG(e.target.value);if(v!==e.target.value)e.target.value=v;state.ig=v;lsSet();render()};
$("#fSave").onclick=()=>{state.saveEach=state.saveEach===false;lsSet();stats()};
$("#fTodo").onclick=e=>{filterTodo=!filterTodo;e.target.setAttribute("aria-pressed",filterTodo);render()};
$("#fOpen").onclick=e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",on);e.target.textContent=on?"Tout replier":"Tout déplier";document.querySelectorAll("details.sec").forEach(d=>d.open=on)};

function csvCell(v){v=String(v??"");return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$("#exp").onclick=async()=>{
  if(!state.ig){msg("Renseigne le code IG avant d'exporter.");$("#ig").focus();return}
  if(!photos.length){msg("Aucune photo à exporter.");return}
  
  const btn=$("#exp");btn.disabled=true;msg("Préparation du ZIP…");
  try{
    const zip=new JSZip();const rows=[["Section","Désignation","Statut","Nb photos","Fichiers","Commentaire"]];
    const groups=[...SECTIONS.map(([s,a])=>[s,a.map(x=>x[0])]),["Photos libres",state.extra]];
    groups.forEach(([s,codes])=>codes.forEach(c=>{
      const ps=itemPhotos(c);const names=ps.map((p,i)=>fileName(c,i,ps.length));
      ps.forEach((p,i)=>zip.file(names[i],p.blob,{date:new Date(p.ts)}));
      rows.push([s,(ITEMS[c]||{l:c}).l,state.st[c]||"",ps.length,names.join(" | "),state.cm[c]||""]);
    }));
    zip.file(`${state.ig}_recap_photos.csv`,"﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"));
    const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
    const dl=DL;
    if(!dl){msg("Téléchargement indisponible.");return}
    await dl.save({filename:`${state.ig}_photos_audit_${today()}.zip`,data:blob});
    msg(`ZIP enregistré : ${photos.length} photos + récap CSV.`);
  }catch(e){msg(e&&e.code==="declined"?"Export annulé.":"Export impossible ("+((e&&e.code)||"erreur")+"). Réessaie.")}
  finally{btn.disabled=false}
};

let armed=false;
$("#reset").onclick=async()=>{
  if(!armed){armed=true;$("#reset").textContent="Confirmer ?";msg("Toutes les photos et statuts seront effacés. Appuie encore pour confirmer.");setTimeout(()=>{armed=false;$("#reset").textContent="Nouvel audit"},4000);return}
  armed=false;$("#reset").textContent="Nouvel audit";
  photos=[];urls.forEach(u=>URL.revokeObjectURL(u));urls.clear();await idb("readwrite",s=>s.clear());
  state={ig:"",st:{},cm:{},extra:[],saveEach:false,v3:1};lsSet();$("#ig").value="";msg("Audit réinitialisé.");render();
};

(async()=>{
  lsGet();if(!state.v3){state.saveEach=false;state.v3=1;lsSet()}$("#ig").value=state.ig;render();
  const all=await idb("readonly",s=>s.getAll());if(all&&all.length){photos=all;render();msg(`${all.length} photo(s) restaurée(s) de la session précédente.`)}
})();
</script>
